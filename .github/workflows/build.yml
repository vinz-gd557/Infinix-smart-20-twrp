name: Build TWRP X6840

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5-dev \
            x11proto-core-dev libx11-dev libreadline-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig repo rsync

      - name: Initialize TWRP
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

      - name: Sync TWRP
        run: |
          cd ~/twrp
          repo sync -c --force-sync --no-clone-bundle --no-tags -j2

      - name: Clone X6840 tree
        run: |
          cd ~/twrp
          git clone -b twrp-12.1 \
            https://github.com/XTENSEI/twrp_device_infinix_X6840.git \
            device/infinix/X6840

      - name: Build
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_X6840-eng
          mka vendorbootimage -j2

      - name: Upload vendor_boot
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-X6840
          path: ~/twrp/out/target/product/X6840/vendor_boot.img
